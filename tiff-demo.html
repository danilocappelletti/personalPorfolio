<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIFF Image Editor Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="tiff-demo.css">
</head>
<body>
<div class="demo-container">
    <div class="header">
        <h1><i class="fas fa-image"></i> TIFF Image Editor</h1>
        <button class="close-btn" onclick="goBack()">← Back to Portfolio</button>
    </div>
    
    <div class="workspace">
        <div class="toolbar">
            <button class="tool-btn active" onclick="setTool('add')"><i class="fas fa-plus"></i> Add Section</button>
            <button class="tool-btn" onclick="setTool('select')"><i class="fas fa-hand-pointer"></i> Select</button>
            <button class="tool-btn" onclick="arrangeH()"><i class="fas fa-arrows-alt-h"></i> H-Arrange</button>
            <button class="tool-btn" onclick="arrangeV()"><i class="fas fa-arrows-alt-v"></i> V-Arrange</button>
            
            <div class="tool-section">Transform</div>
            <button class="tool-btn" onclick="rotateSelected()"><i class="fas fa-sync"></i> Rotate 90°</button>
            <button class="tool-btn" onclick="flipSelected()"><i class="fas fa-arrows-alt-h"></i> Flip H</button>
            
            <div class="tool-section">Canvas</div>
            <button class="tool-btn" onclick="clearAll()"><i class="fas fa-trash"></i> Clear All</button>
            <button class="tool-btn" onclick="exportDemo()"><i class="fas fa-download"></i> Export</button>
        </div>

        <div class="canvas-area">
            <div class="canvas" id="canvas"></div>
        </div>

        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Sections</div>
                <div id="sectionsList"></div>
                <button class="btn-add" onclick="addItem()"><i class="fas fa-plus"></i> New Section</button>
                <button class="btn-remove" onclick="deleteSelected()"><i class="fas fa-trash"></i> Delete Selected</button>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">Canvas Info</div>
                <div class="stat">Items: <span class="stat-val" id="itemCount">0</span></div>
                <div class="stat">Canvas: <span class="stat-val">800×600</span></div>
                <div class="stat">Zoom: <span class="stat-val">100%</span></div>
            </div>
        </div>
    </div>

    <div class="status-bar" id="status">Drag sections on canvas • <strong id="tip">Tip: Click "Add Section" to start</strong></div>
</div>

<script>
let items = [];
let selectedId = null;
let currentTool = 'add';
let draggedItem = null;
let dragOffset = { x: 0, y: 0 };

function goBack() {
    window.location.href = 'index.html#projects';
}

function setTool(tool) {
    currentTool = tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    event.target.closest('.tool-btn').classList.add('active');
    updateStatus(`Tool: ${tool === 'add' ? 'Add Section' : 'Select Mode'}`);
}

function addItem() {
    const id = Date.now();
    const x = Math.random() * 500 + 50;
    const y = Math.random() * 300 + 50;
    items.push({ id, x, y, rotation: 0, label: `Image ${items.length + 1}` });
    render();
    updateStatus(`Added: Image ${items.length}`);
}

function deleteSelected() {
    if (!selectedId) return;
    items = items.filter(i => i.id !== selectedId);
    selectedId = null;
    render();
    updateStatus('Deleted section');
}

function clearAll() {
    items = [];
    selectedId = null;
    render();
    updateStatus('Canvas cleared');
}

function rotateSelected() {
    const item = items.find(i => i.id === selectedId);
    if (item) {
        item.rotation = (item.rotation + 90) % 360;
        render();
        updateStatus(`Rotated: ${item.rotation}°`);
    }
}

function flipSelected() {
    const item = items.find(i => i.id === selectedId);
    if (item) {
        item.flipped = !item.flipped;
        render();
        updateStatus('Flipped horizontally');
    }
}

function arrangeH() {
    if (!items.length) return;
    const spacing = 130;
    items.forEach((item, i) => {
        item.x = 50 + i * spacing;
        item.y = 200;
    });
    render();
    updateStatus('Arranged horizontally');
}

function arrangeV() {
    if (!items.length) return;
    const spacing = 120;
    items.forEach((item, i) => {
        item.x = 300;
        item.y = 50 + i * spacing;
    });
    render();
    updateStatus('Arranged vertically');
}

function exportDemo() {
    alert(`✓ Exported 3 sections as TIFF\n- Image 1: 2048×1536 (300 DPI)\n- Image 2: 2048×1536 (300 DPI)\n- Image 3: 2048×1536 (300 DPI)\n\nTotal size: 18.5 MB`);
    updateStatus('Export complete');
}

function updateStatus(msg) {
    document.getElementById('status').textContent = `${msg} • Total items: ${items.length}`;
}

function render() {
    const canvas = document.getElementById('canvas');
    canvas.innerHTML = '';
    
    items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'drop-item' + (item.id === selectedId ? ' selected' : '');
        div.textContent = item.label;
        div.style.left = item.x + 'px';
        div.style.top = item.y + 'px';
        div.style.transform = `rotate(${item.rotation}deg) scaleX(${item.flipped ? -1 : 1})`;
        
        div.addEventListener('mousedown', (e) => startDrag(e, item.id));
        div.addEventListener('click', () => {
            selectedId = item.id;
            render();
            updateSectionsList();
        });
        
        canvas.appendChild(div);
    });
    
    document.getElementById('itemCount').textContent = items.length;
    updateSectionsList();
}

function startDrag(e, id) {
    draggedItem = items.find(i => i.id === id);
    selectedId = id;
    const rect = e.target.getBoundingClientRect();
    dragOffset.x = e.clientX - rect.left;
    dragOffset.y = e.clientY - rect.top;
    e.target.classList.add('dragging');
    render();
}

document.addEventListener('mousemove', (e) => {
    if (!draggedItem) return;
    const canvas = document.getElementById('canvas').getBoundingClientRect();
    draggedItem.x = Math.max(0, Math.min(canvas.width - 120, e.clientX - canvas.left - dragOffset.x));
    draggedItem.y = Math.max(0, Math.min(canvas.height - 100, e.clientY - canvas.top - dragOffset.y));
    render();
});

document.addEventListener('mouseup', () => {
    draggedItem = null;
    document.querySelectorAll('.drop-item').forEach(d => d.classList.remove('dragging'));
});

function updateSectionsList() {
    const list = document.getElementById('sectionsList');
    list.innerHTML = items.map(item => `
        <div class="stat" style="padding: 6px 8px; background: #334155; margin-bottom: 4px; border-radius: 3px; cursor: pointer; ${item.id === selectedId ? 'border-left: 3px solid #60a5fa;' : ''}" onclick="selectedId = ${item.id}; render(); updateSectionsList();">
            ${item.label}
        </div>
    `).join('');
}

// Init
addItem();
</script>
</body>
</html>
